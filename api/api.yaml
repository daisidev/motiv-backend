openapi: 3.0.0
info:
  title: Motiv API
  version: 1.0.0
  description: API for the Motiv event platform.

servers:
  - url: /api/v1

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  version:
                    type: string

  # Authentication endpoints
  /auth/signup:
    post:
      summary: User signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad request - validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/google:
    post:
      summary: Google OAuth authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserResponse'
                  isNewUser:
                    type: boolean
        '201':
          description: New user created and logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserResponse'
                  isNewUser:
                    type: boolean

  /auth/forgot-password:
    post:
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Password reset email sent (if account exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/reset-password:
    post:
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # User endpoints
  /users/me:
    get:
      summary: Get current user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    put:
      summary: Update current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /users/me/tickets:
    get:
      summary: Get tickets for the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketResponse'

  /users/me/tickets/{id}:
    get:
      summary: Get specific ticket for the current user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'

  /users/me/tickets/debug:
    get:
      summary: Debug endpoint for user tickets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Debug information for tickets
          content:
            application/json:
              schema:
                type: object

  /users/me/wishlist:
    get:
      summary: Get user's wishlist
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of events in wishlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
    post:
      summary: Add an event to the wishlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Event added to wishlist
    delete:
      summary: Remove an event from the wishlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Event removed from wishlist

  /users/me/wishlist/check:
    get:
      summary: Check if event is in user's wishlist
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Wishlist status
          content:
            application/json:
              schema:
                type: object
                properties:
                  inWishlist:
                    type: boolean

  # Event endpoints
  /events:
    get:
      summary: List all events with pagination and filtering
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
          description: Search term for event title or description
        - name: tags
          in: query
          schema:
            type: string
          description: Comma-separated list of tags
        - name: location
          in: query
          schema:
            type: string
          description: Location filter
        - name: event_type
          in: query
          schema:
            type: string
            enum: [free, ticketed]
          description: Filter by event type
        - name: date_from
          in: query
          schema:
            type: string
            format: date
          description: Filter events from this date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
          description: Filter events until this date
      responses:
        '200':
          description: Paginated list of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventResponse'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  hasMore:
                    type: boolean

  /events/suggestions:
    get:
      summary: Get search suggestions
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Query string for suggestions
      responses:
        '200':
          description: List of search suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /events/{id}:
    get:
      summary: Get event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /events/{id}/reviews:
    get:
      summary: Get reviews for an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResponse'

  /events/{id}/analytics:
    get:
      summary: Get analytics for an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAnalytics'

  /events/{id}/revenue:
    get:
      summary: Get revenue for an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event revenue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revenue:
                        type: number

  /events/{id}/view:
    post:
      summary: Record a view for an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event view recorded

  # Host endpoints
  /hosts/me/events:
    get:
      summary: Get events created by the logged-in host
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
    post:
      summary: Create a new event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Bad request - validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /hosts/me/events/{id}:
    put:
      summary: Update an event
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '200':
          description: Event updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '403':
          description: Not authorized to update this event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete an event
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Event deleted successfully
        '403':
          description: Not authorized to delete this event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /hosts/me/analytics/dashboard:
    get:
      summary: Get dashboard stats for the logged-in host
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostAnalytics'

  /hosts/me/analytics/revenue:
    get:
      summary: Get monthly revenue for the logged-in host
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Monthly revenue
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    month:
                      type: string
                    revenue:
                      type: number

  /hosts/me/reviews:
    get:
      summary: Get reviews for the logged-in host
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResponse'

  /hosts/me/payments/earnings:
    get:
      summary: Get earnings for the logged-in host
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Host earnings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HostEarnings'

  /hosts/me/payments/payouts:
    get:
      summary: Get payouts for the logged-in host
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: A list of payouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payout'

  /hosts/me/payments/pending:
    get:
      summary: Get pending payouts for the logged-in host
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of pending payouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payout'

  # Host attendee management
  /hosts/me/attendees:
    get:
      summary: Get all attendees for host's events
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: event_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by specific event
        - name: ticket_type
          in: query
          schema:
            type: string
          description: Filter by ticket type
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, checked_in, cancelled]
          description: Filter by attendee status
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or email
      responses:
        '200':
          description: Paginated list of attendees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendeeListResponse'

  /hosts/me/attendees/export:
    get:
      summary: Export attendees to CSV
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: query
          schema:
            type: string
            format: uuid
        - name: ticket_type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: CSV file with attendee data
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /hosts/me/events/{eventId}/attendees:
    get:
      summary: Get attendees for a specific event
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Paginated list of event attendees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendeeListResponse'
        '403':
          description: Not authorized to view attendees for this event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /hosts/me/attendees/checkin:
    post:
      summary: Check in an attendee via QR code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                qrCode:
                  type: string
                eventId:
                  type: string
                  format: uuid
              required:
                - qrCode
                - eventId
      responses:
        '200':
          description: Attendee checked in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  attendee:
                    $ref: '#/components/schemas/AttendeeResponse'
        '400':
          description: Invalid QR code or already checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Review endpoints
  /reviews:
    post:
      summary: Create a new review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'

  /reviews/{id}:
    put:
      summary: Update a review
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
      responses:
        '200':
          description: Review updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
    delete:
      summary: Delete a review
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Review deleted successfully

  /reviews/{id}/helpful:
    post:
      summary: Mark a review as helpful
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review marked as helpful

  # Payment endpoints
  /payments/initiate:
    post:
      summary: Initiate payment for ticket purchase
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInitiationRequest'
      responses:
        '200':
          description: Payment initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInitiationResponse'
        '400':
          description: Bad request - validation errors or insufficient tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payments/webhook:
    post:
      summary: Payment webhook from Paystack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaystackWebhookEvent'
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /payments/simulate-success:
    post:
      summary: Simulate successful payment (for testing)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reference:
                  type: string
                eventId:
                  type: string
                  format: uuid
                attendeeData:
                  $ref: '#/components/schemas/AttendeeDataRequest'
                attendees:
                  type: array
                  items:
                    $ref: '#/components/schemas/AttendeeDataRequest'
                ticketDetails:
                  type: array
                  items:
                    $ref: '#/components/schemas/TicketDetailRequest'
              required:
                - reference
                - eventId
                - attendeeData
                - ticketDetails
      responses:
        '200':
          description: Payment simulated and tickets created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  # Ticket endpoints
  /tickets/purchase:
    post:
      summary: Purchase a ticket (legacy endpoint)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseTicketRequest'
      responses:
        '201':
          description: Ticket purchased successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'

  /tickets/rsvp:
    post:
      summary: RSVP for a free event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: string
                  format: uuid
                attendeeFullName:
                  type: string
                attendeeEmail:
                  type: string
                  format: email
                attendeePhone:
                  type: string
              required:
                - eventId
                - attendeeFullName
                - attendeeEmail
                - attendeePhone
      responses:
        '201':
          description: RSVP successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  ticket:
                    $ref: '#/components/schemas/TicketResponse'

  /tickets/regenerate-qr:
    post:
      summary: Regenerate QR codes for user's tickets (Development endpoint)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: QR codes regenerated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  updated:
                    type: integer
                  total:
                    type: integer

  # Admin endpoints
  /admin/stats:
    get:
      summary: Get platform statistics (Admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStats'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users:
    get:
      summary: Get all users with filtering (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
          description: Search by name, email, or username
        - name: role
          in: query
          schema:
            type: string
            enum: [guest, host, admin, superhost]
          description: Filter by user role
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUserResponse'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  hasMore:
                    type: boolean
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users/{userId}:
    get:
      summary: Get detailed user information (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detailed user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AdminUserResponse'
                  tickets:
                    type: array
                    items:
                      $ref: '#/components/schemas/TicketResponse'
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventResponse'
        '403':
          description: Admin access required
        '404':
          description: User not found

  /admin/users/{userId}/role:
    put:
      summary: Update user role (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [guest, host, admin, superhost]
              required:
                - role
      responses:
        '200':
          description: User role updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Admin access required
        '404':
          description: User not found

  /admin/transactions:
    get:
      summary: Get all transactions with filtering (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, completed, failed, cancelled]
          description: Filter by transaction status
      responses:
        '200':
          description: Paginated list of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminTransactionResponse'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  hasMore:
                    type: boolean
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Error Response
    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    # User Schemas
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        avatar:
          type: string
        role:
          type: string
          enum: [guest, host, admin, superhost]
        newsletter_subscribed:
          type: boolean
          description: Whether user has subscribed to newsletter

    SignupRequest:
      type: object
      required:
        - name
        - username
        - email
        - password
        - confirmPassword
      properties:
        name:
          type: string
          minLength: 2
        username:
          type: string
          minLength: 3
          maxLength: 30
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        confirmPassword:
          type: string
        role:
          type: string
          enum: [guest, host]
          default: guest
        newsletterSubscribed:
          type: boolean
          default: false
          description: Whether user wants to subscribe to newsletter

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    GoogleAuthRequest:
      type: object
      required:
        - idToken
      properties:
        idToken:
          type: string

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email



